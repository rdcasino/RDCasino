<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>RDCasino — Admin</title>
<link rel="icon" href="../assets/img/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<!-- LOGIN (demo) -->
<div class="adm-login" id="adm-login">
  <form class="card adm-login-card" id="adm-login-form">
    <div class="row" style="gap:10px;margin-bottom:22px">
      <img src="../assets/img/brand/logo.svg" alt="" width="34" height="34" style="border-radius:9px">
      <div><strong class="brand-name">RD<span>Casino</span></strong><div class="faint" style="font-size:12px">Back-office</div></div>
    </div>
    <div class="field"><label>E-mail</label><input class="input" type="email" required placeholder="admin@rdcasino.com"></div>
    <div class="field"><label>Senha</label><input class="input" type="password" required placeholder="••••••••"></div>
    <div class="field"><label>Código 2FA</label><input class="input" inputmode="numeric" maxlength="6" placeholder="000000"></div>
    <button class="btn btn-primary btn-block btn-lg">Entrar</button>
    <div class="notice" style="margin-top:16px"><span data-ic="alert"></span><span>Demonstração: qualquer credencial entra. Em produção, o admin precisa de autenticação no servidor, 2FA obrigatório e acesso restrito por IP.</span></div>
  </form>
</div>

<div class="adm hidden" id="adm">
  <aside class="adm-side" id="adm-side">
    <a class="adm-brand" href="#/dashboard">
      <img src="../assets/img/brand/logo.svg" alt="" width="28" height="28" style="border-radius:8px">
      <span class="brand-name">RD<span>Casino</span></span>
      <span class="badge" style="margin-left:auto">Admin</span>
    </a>
    <nav id="adm-nav"></nav>
    <div class="adm-side-foot">
      <a class="adm-link" href="../index.html" target="_blank"><span data-ic="external"></span>Ver site</a>
    </div>
  </aside>
  <div class="adm-backdrop" id="adm-backdrop"></div>

  <div class="adm-main">
    <header class="adm-header">
      <button class="btn btn-ghost btn-icon adm-burger" id="adm-burger" aria-label="Menu"><span data-ic="menu"></span></button>
      <div class="adm-title" id="adm-title">Dashboard</div>
      <div class="row" style="margin-left:auto;gap:8px">
        <span class="badge badge-warn adm-env">Ambiente de demonstração</span>
        <button class="btn btn-ghost btn-icon" aria-label="Notificações"><span data-ic="bell"></span></button>
        <div class="row adm-me"><span class="avatar" style="background:var(--brand);color:var(--brand-ink)">AD</span><div><strong>Admin</strong><small class="faint">Super admin</small></div></div>
        <button class="btn btn-ghost btn-icon" id="adm-logout" aria-label="Sair"><span data-ic="logout"></span></button>
      </div>
    </header>
    <main class="adm-view" id="adm-view"></main>
  </div>
</div>

<aside class="drawer" id="adm-drawer">
  <div class="drawer-head"><h3 id="adm-drawer-title"></h3><button class="btn btn-ghost btn-icon btn-sm" data-close-drawer aria-label="Fechar"><span data-ic="x"></span></button></div>
  <div class="drawer-body" id="adm-drawer-body"></div>
</aside>

<div class="overlay" id="adm-modal"><div class="modal modal-lg" id="adm-modal-box"></div></div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/data.js"></script>
<script>RD.imgBase = "../";</script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
